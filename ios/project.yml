# Projeto Xcode do Race Cities para iPhone/iPad (gerado com XcodeGen: `xcodegen generate`).
# VERSÃO DA LOJA: SEM anúncios (nenhum SDK do Google, sem SKAdNetwork). Para a versão com AdMob,
# use ios/project-com-anuncios.yml (cópia desta com o SDK, os IDs e a lista SKAdNetwork).
# Pasta, alvo e esquema continuam "MarileoKart" (só nomes internos); o nome do app é "Race Cities".
name: MarileoKart
options:
  bundleIdPrefix: com.marileostudios
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  MarileoKart:
    type: application
    platform: iOS
    sources:
      - path: MarileoKart
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marileostudios.racecities
        PRODUCT_NAME: Race Cities
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MarileoKart/Info.plist
    info:
      path: MarileoKart/Info.plist
      properties:
        CFBundleDisplayName: Race Cities
        CFBundleName: Race Cities
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-BR
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.racing-games
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        GCSupportsControllerUserInteraction: true
        NSLocalNetworkUsageDescription: O modo Online com Amigos conecta os celulares que estão jogando juntos.
