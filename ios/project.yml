# Projeto Xcode do Race Cities para iPhone/iPad (gerado com XcodeGen: `xcodegen generate`).
# Pasta, alvo e esquema continuam "MarileoKart" (só nomes internos); o nome do app é "Race Cities".
name: MarileoKart
options:
  bundleIdPrefix: com.marileostudios
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  # Google Mobile Ads SDK (AdMob) pelo Swift Package Manager.
  # "from" = até a próxima versão principal (13.x); a 14 pode renomear a API em Swift.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.12.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # ===== IDs do Google AdMob (iOS) =====
    # Hoje: IDs de TESTE oficiais do Google. Quando a conta AdMob existir, troque
    # pelos do app iOS "Race Cities" (veja ios/LEIA-ME.md, seção Anúncios).
    # Mesmo com IDs reais, o app só pede anúncios reais se js/ads-config.js estiver
    # com test: false (e nunca na configuração Debug).
    ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
    ADMOB_INTERSTITIAL_ID: ca-app-pub-3940256099942544/4411468910
    ADMOB_REWARDED_ID: ca-app-pub-3940256099942544/1712485313
targets:
  MarileoKart:
    type: application
    platform: iOS
    sources:
      - path: MarileoKart
      - path: www
        type: folder
        buildPhase: resources
    dependencies:
      - package: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marileostudios.racecities
        PRODUCT_NAME: Race Cities
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MarileoKart/Info.plist
    info:
      path: MarileoKart/Info.plist
      properties:
        CFBundleDisplayName: Race Cities
        CFBundleName: Race Cities
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-BR
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.racing-games
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        GCSupportsControllerUserInteraction: true
        NSLocalNetworkUsageDescription: O modo Online com Amigos conecta os celulares que estão jogando juntos.
        # AdMob: ID do app (vem de ADMOB_APP_ID acima)
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        RCAdMobInterstitialID: $(ADMOB_INTERSTITIAL_ID)
        RCAdMobRewardedID: $(ADMOB_REWARDED_ID)
        # Sem NSUserTrackingUsageDescription de propósito: o app NÃO pede permissão de
        # rastreamento (ATT). Público inclui crianças: anúncios sem personalização.
        # Lista SKAdNetwork exigida pelo Google (copiada de
        # https://developers.google.com/admob/ios/quick-start em 2026-11-13, 50 itens).
        SKAdNetworkItems:
