org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Versão do app (a loja exige versionCode sempre maior a cada envio).
# Também pode vir das variáveis de ambiente VERSION_CODE / VERSION_NAME (o GitHub Actions usa isso).
appVersionCode=1
appVersionName=1.0

# true = não embute o jogo no APK; o app abre o site (precisa de internet).
# Padrão false: o jogo vai dentro do app (funciona offline), gerado por ios/build-web.mjs (precisa de Node).
remoteGame=false
