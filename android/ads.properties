#  oficiais do Google (mostram anúncios de mentira, sem dinheiro).
#
#  Quando a conta AdMob existir:
#   1. AdMob > Apps > Adicionar app > Android > (Race Cities)
#      -> copie o "ID do app" (formato ca-app-pub-XXXXXXXXXXXXXXXX~NNNNNNNNNN)
#   2. Nesse app, crie 2 blocos de anúncios:
#      "Intersticial" (intervalo) e "Premiado" (recompensa)
#      -> copie os IDs (formato ca-app-pub-XXXXXXXXXXXXXXXX/NNNNNNNNNN)
#   3. Cole abaixo, no lugar dos de teste, e gere uma nova versão.
#
#  Segurança: mesmo com IDs reais aqui, o app só pede anúncios REAIS quando
#  - é a versão "release" (a da loja), E
#  - js/ads-config.js estiver com test: false.
#  Em qualquer outro caso ele usa os blocos de teste do Google.
#  (Nunca clique em anúncios reais no seu próprio celular: o AdMob bloqueia a conta.)
#
#  Também podem vir de variáveis de ambiente: ADMOB_APP_ID,
#  ADMOB_INTERSTITIAL_ID, ADMOB_REWARDED_ID (têm prioridade sobre este arquivo).
