<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cristo: procedural x Blender</title>
  <style>
    html, body { margin: 0; height: 100%; background: #9fd3ff; font: 14px/1.35 system-ui, sans-serif; color: #1b2430; overflow: hidden; }
    canvas { display: block; }
    .lbl { position: fixed; top: 10px; padding: 6px 10px; background: #ffffffd9; border-radius: 8px; font-weight: 700; }
    #l { left: 10px; } #r { left: calc(50% + 10px); }
    #bar { position: fixed; top: 48px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    button { font: inherit; padding: 6px 10px; border: 0; border-radius: 8px; background: #ffffffd9; cursor: pointer; }
    button.on { background: #ffd23f; box-shadow: inset 0 0 0 2px #1b2430; }
    #stats { position: fixed; left: 10px; right: 10px; bottom: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #stats div { background: #ffffffe6; border-radius: 8px; padding: 8px 10px; white-space: pre-line; font-variant-numeric: tabular-nums; }
    #split { position: fixed; top: 0; bottom: 0; left: 50%; width: 2px; background: #ffffffaa; }
    #err { position: fixed; inset: 40% 10px auto; text-align: center; color: #a00; font-weight: 700; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="split"></div>
  <div class="lbl" id="l">Procedural (js/cities/lm-west.js)</div>
  <div class="lbl" id="r">Blender (assets/models/cristo.glb)</div>
  <div id="bar">
    <button data-k="modo" data-v="estatua">Só a estátua</button>
    <button data-k="modo" data-v="completo">Marco completo</button>
    <button data-k="mat" data-v="jogo">Materiais do jogo</button>
    <button data-k="mat" data-v="glb">Materiais do .glb</button>
    <button data-k="noite" data-v="1">Noite</button>
  </div>
  <div id="stats"><div id="sl"></div><div id="sr"></div></div>
  <div id="err"></div>
<script type="module">
// Página de teste (não faz parte do jogo): carrega o Cristo feito no Blender e compara com o
// procedural, lado a lado, com a mesma câmera. Rodar com um servidor na raiz do projeto, ex.:
//   npx serve .   e abrir  /tools/blender/viewer.html
// Parâmetros: ?modo=estatua|completo  &mat=jogo|glb  &noite=1  &ang=graus (câmera)  &glb=caminho.glb
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { makeMaterials, paint, bakeObject } from '../../js/cities/common.js';
import { LANDMARKS_A } from '../../js/cities/lm-west.js';

const q = new URLSearchParams(location.search);
const opt = { modo: q.get('modo') || 'estatua', mat: q.get('mat') || 'jogo', noite: q.get('noite') === '1' };
const GLB = q.get('glb') || '../../assets/models/cristo.glb';
const ST_Y = 88, ST_S = 1.5; // onde o procedural põe a estátua no morro (lm-west.js)

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.info.autoReset = false;
document.body.prepend(renderer.domElement);

const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 4000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const tris = g => { let n = 0; g.traverse(m => { if (m.isMesh) { const ge = m.geometry; n += (ge.index ? ge.index.count : ge.attributes.position.count) / 3; } }); return n; };
const meshes = g => { let n = 0; g.traverse(m => { if (m.isMesh) n++; }); return n; };
const matsOf = g => { const s = new Set(); g.traverse(m => { if (m.isMesh) s.add(m.material); }); return s.size; };

function makeScene(night) {
  const s = new THREE.Scene();
  s.background = new THREE.Color(night ? 0x1a2240 : 0x9fd3ff);
  s.add(new THREE.HemisphereLight(night ? 0x5a6aa0 : 0xcfe8ff, night ? 0x202030 : 0x8a7a5a, night ? 0.6 : 1.25));
  const sun = new THREE.DirectionalLight(night ? 0x9aaee0 : 0xffffff, night ? 0.6 : 2.4);
  sun.position.set(60, 140, 90); sun.castShadow = true; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -160, right: 160, top: 160, bottom: -160, far: 500 });
  s.add(sun);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(400, 48), new THREE.MeshStandardMaterial({ color: night ? 0x2a3a2a : 0x6fae5a, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; s.add(ground);
  return s;
}

// Monta o marco procedural de verdade (mesma função do jogo) com um "ctx" mínimo.
function buildProcedural(mats) {
  const ctx = { mats, P: (c, cls = 'solid') => paint(mats, c, cls) };
  const g = new THREE.Group();
  LANDMARKS_A.cristo.build(ctx, g, {}, {});
  const st = g.children.find(c => c.isGroup); // o grupo da estátua (pedestal + corpo + braços)
  return { g, st };
}

// Normaliza uma geometria do .glb para o formato que o jogo junta (sem índice; posição, normal, cor rgb float).
function gameGeo(src, matrix) {
  const g = src.index ? src.toNonIndexed() : src.clone();
  g.applyMatrix4(matrix);
  const c = g.attributes.color, n = g.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c ? c.getX(i) : 1; a[i * 3 + 1] = c ? c.getY(i) : 1; a[i * 3 + 2] = c ? c.getZ(i) : 1; }
  for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
  g.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return g;
}

// Como ficaria no jogo: as malhas do .glb trocam o material pelo compartilhado de mesmo nome
// (solid/smooth/neon) e entram na mesma junção do marco (uma malha por material).
function mergeWithGame(mats, bakedGroup, glbRoot) {
  const byMat = new Map();
  bakedGroup.children.forEach(m => byMat.set(m.material, [m.geometry]));
  glbRoot.updateMatrixWorld(true);
  glbRoot.traverse(m => {
    if (!m.isMesh) return;
    const mat = mats[m.material.name] || mats.smooth;
    if (!byMat.has(mat)) byMat.set(mat, []);
    byMat.get(mat).push(gameGeo(m.geometry, m.matrixWorld));
  });
  const out = new THREE.Group();
  for (const [mat, geos] of byMat) {
    const mm = new THREE.Mesh(mergeGeometries(geos), mat);
    mm.castShadow = mat.type !== 'MeshBasicMaterial'; mm.receiveShadow = true;
    out.add(mm);
  }
  return out;
}

const sides = [{ el: document.getElementById('sl') }, { el: document.getElementById('sr') }];
let glbScene, glbBytes = 0;

async function setup() {
  if (!glbScene) {
    const buf = await (await fetch(GLB)).arrayBuffer();
    glbBytes = buf.byteLength;
    glbScene = (await new GLTFLoader().parseAsync(buf, '')).scene;
  }
  const mats = makeMaterials(opt.noite ? 1 : 0.2);
  for (const s of sides) s.scene = makeScene(opt.noite);

  // ---------- esquerda: procedural ----------
  const P = buildProcedural(mats);
  let left;
  if (opt.modo === 'estatua') {
    P.st.position.set(0, 0, 0); P.st.scale.setScalar(ST_S);
    left = bakeObject(P.st);
  } else left = bakeObject(P.g);
  sides[0].scene.add(left);
  sides[0].info = { tris: tris(left), meshes: meshes(left), mats: matsOf(left), statueTris: tris(bakeObject(buildProcedural(mats).st)) };

  // ---------- direita: Blender ----------
  const statue = glbScene.clone(true);
  statue.scale.setScalar(ST_S);
  let right;
  if (opt.mat === 'glb') {
    statue.traverse(m => { if (m.isMesh) { m.castShadow = m.receiveShadow = true; } });
    if (opt.modo === 'completo') {
      const hill = buildProcedural(mats); hill.g.remove(hill.st);
      right = new THREE.Group(); right.add(bakeObject(hill.g));
      statue.position.y = ST_Y; right.add(statue);
    } else right = statue;
  } else {
    const hill = new THREE.Group();
    if (opt.modo === 'completo') { const h = buildProcedural(mats); h.g.remove(h.st); hill.add(h.g); statue.position.y = ST_Y; }
    const bakedHill = bakeObject(hill);
    right = mergeWithGame(mats, bakedHill, statue);
  }
  sides[1].scene.add(right);
  const raw = glbScene.clone(true);
  sides[1].info = { tris: tris(right), meshes: meshes(right), mats: matsOf(right), statueTris: tris(raw), glbMeshes: meshes(raw), glbMats: matsOf(raw) };

  // câmera
  const full = opt.modo === 'completo';
  const ty = full ? 70 : 21, dist = full ? 300 : 82, az = THREE.MathUtils.degToRad(+(q.get('ang') ?? 25));
  camera.position.set(Math.sin(az) * dist, ty + (full ? 45 : 8), Math.cos(az) * dist);
  controls.target.set(0, ty, 0);
  controls.update();

  document.querySelectorAll('#bar button').forEach(b => {
    const v = b.dataset.k === 'noite' ? opt.noite : opt[b.dataset.k] === b.dataset.v;
    b.classList.toggle('on', !!v);
  });
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = (innerWidth / 2) / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const stats = window.__stats = {};
function frame() {
  controls.update();
  const w = innerWidth / 2, h = innerHeight;
  renderer.setScissorTest(true);
  sides.forEach((s, k) => {
    if (!s.scene) return;
    renderer.info.reset();
    renderer.setViewport(k * w, 0, w, h); renderer.setScissor(k * w, 0, w, h);
    renderer.render(s.scene, camera);
    s.calls = renderer.info.render.calls; s.drawnTris = renderer.info.render.triangles;
  });
  if (sides[1].info) {
    const [L, R] = sides;
    // chamadas de desenho medidas pelo three (inclui o chão: 1 chamada)
    L.el.textContent = `Procedural — ${opt.modo === 'estatua' ? 'estátua' : 'marco completo'}\n` +
      `malhas depois da junção: ${L.info.meshes} (materiais: ${L.info.mats})\n` +
      `triângulos: ${L.info.tris.toLocaleString('pt-BR')}  (só a estátua: ${L.info.statueTris})\n` +
      `draw calls medidas (com o chão): ${L.calls}\n` +
      `código: ~15 linhas em lm-west.js (0 KB extra para baixar)`;
    R.el.textContent = `Blender .glb — ${opt.mat === 'jogo' ? 'juntado com os materiais do jogo' : 'materiais do próprio .glb'}\n` +
      `malhas na cena: ${R.info.meshes} (materiais: ${R.info.mats})  |  no arquivo: ${R.info.glbMeshes} primitivas, ${R.info.glbMats} materiais\n` +
      `triângulos: ${R.info.tris.toLocaleString('pt-BR')}  (só a estátua: ${R.info.statueTris})\n` +
      `draw calls medidas (com o chão): ${R.calls}\n` +
      `arquivo: ${(glbBytes / 1024).toFixed(1)} KB`;
    Object.assign(stats, { opt: { ...opt }, procedural: { ...L.info, calls: L.calls }, blender: { ...R.info, calls: R.calls, glbBytes }, ready: true });
  }
  requestAnimationFrame(frame);
}

document.getElementById('bar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.k === 'noite') opt.noite = !opt.noite; else opt[b.dataset.k] = b.dataset.v;
  stats.ready = false;
  setup();
});

resize();
setup().then(() => requestAnimationFrame(frame)).catch(err => {
  document.getElementById('err').textContent = 'Erro: ' + err.message + ' (rode tools/blender/cristo.py antes e abra por um servidor http)';
  console.error(err);
});
</script>
</body>
</html>
